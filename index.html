<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Anggota Baru - SMKN Tengaran</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Canvas Jejak Kursor -->
  <canvas id="cursorCanvas"></canvas>

  <!-- Latar Belakang Garis Neon & Elemen Melayang -->
  <div class="bg-elements">
    <div class="floating-icon lock-1"><i class="fas fa-lock"></i></div>
    <div class="floating-icon lock-2"><i class="fas fa-lock"></i></div>
    <div class="floating-icon gear-1"><i class="fas fa-cog"></i></div>
    <div class="floating-icon user-icon"><i class="fas fa-user-shield"></i></div>

    <svg class="neon-line line-1" viewBox="0 0 1000 500">
      <path d="M0,100 C300,300 600,0 1000,200" fill="none" stroke="rgba(0, 210, 255, 0.4)" stroke-width="3" />
      <path d="M0,150 C300,350 600,50 1000,250" fill="none" stroke="rgba(157, 80, 255, 0.4)" stroke-width="2" />
    </svg>
    <svg class="neon-line line-2" viewBox="0 0 1000 500">
      <path d="M0,400 C400,200 700,500 1000,300" fill="none" stroke="rgba(255, 0, 128, 0.3)" stroke-width="3" />
    </svg>
  </div>

  <!-- Container Utama Layout -->
  <div class="main-container">

    <!-- KARAKTER ROBOT FULL BODY (KIRI) -->
    <div class="character-section robot-container">
      <div class="robot-wrapper" id="robotCharacter" title="Klik Saya untuk Berputar!">
        <div class="click-hint robot-hint">Klik Saya!</div>
        <div class="tech-badge">HTML / PHP / JS</div>
        <svg class="robot-svg" viewBox="0 0 200 320">
          <!-- Antena -->
          <line x1="100" y1="40" x2="100" y2="15" stroke="#9d50bb" stroke-width="4"/>
          <circle cx="100" cy="12" r="8" fill="#00d2ff" class="robot-antenna-orb"/>
          
          <!-- Kepala -->
          <rect x="50" y="40" width="100" height="70" rx="20" fill="#2a2d42" stroke="#6c5ce7" stroke-width="4"/>
          <rect x="60" y="50" width="80" height="50" rx="12" fill="#0f111a"/>
          
          <!-- Mata & Gelombang Layar Robot -->
          <g class="robot-eyes">
            <path d="M 68 75 Q 80 60 92 75 T 116 75 T 132 75" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
          </g>
          
          <!-- Leher -->
          <rect x="85" y="110" width="30" height="12" rx="4" fill="#485460"/>
          
          <!-- Badan -->
          <rect x="45" y="122" width="110" height="110" rx="25" fill="#1e272e" stroke="#00d2ff" stroke-width="4"/>
          <!-- Dada/Layar Dada -->
          <rect x="65" y="142" width="70" height="50" rx="10" fill="#0f111a" stroke="#ff007f" stroke-width="2"/>
          <path d="M 75 167 Q 85 145 95 167 T 115 167 T 125 167" fill="none" stroke="#ff007f" stroke-width="3" class="heart-line"/>

          <!-- Lengan Kiri & Tangan -->
          <g class="robot-arm-left">
            <path d="M 45 140 C 20 150 15 180 30 195" fill="none" stroke="#485460" stroke-width="12" stroke-linecap="round"/>
            <circle cx="30" cy="195" r="10" fill="#00d2ff"/>
          </g>
          
          <!-- Lengan Kanan & Tangan -->
          <g class="robot-arm-right">
            <path d="M 155 140 C 180 150 185 180 170 195" fill="none" stroke="#485460" stroke-width="12" stroke-linecap="round"/>
            <circle cx="170" cy="195" r="10" fill="#00d2ff"/>
          </g>
          
          <!-- Kaki Kiri -->
          <rect x="65" y="232" width="22" height="45" rx="8" fill="#485460"/>
          <path d="M 55 277 L 90 277 C 90 277 90 290 72 290 C 55 290 55 277 55 277 Z" fill="#2a2d42" stroke="#00d2ff" stroke-width="2"/>
          
          <!-- Kaki Kanan -->
          <rect x="113" y="232" width="22" height="45" rx="8" fill="#485460"/>
          <path d="M 103 277 L 138 277 C 138 277 138 290 120 290 C 103 290 103 277 103 277 Z" fill="#2a2d42" stroke="#00d2ff" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <!-- FORMULIR PENDAFTARAN (TENGAH) -->
    <div class="form-card">
      <div class="form-header">
        <h2>PENDAFTARAN ANGGOTA BARU</h2>
        <p>Organisasi Ekstrakurikuler Sekolah SMKN Tengaran</p>
      </div>

      <form id="regForm" novalidate>
        <!-- Nama Lengkap -->
        <div class="input-group">
          <label for="fullname">Nama Lengkap</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="fullname" placeholder="Masukkan Nama Lengkap" required>
          </div>
        </div>

        <!-- Email -->
        <div class="input-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" placeholder="contoh@email.com" required>
          </div>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label for="password">Password (minimal 8 karakter)</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="••••••••" required minlength="8">
          </div>
        </div>

        <!-- Konfirmasi Password -->
        <div class="input-group">
          <label for="confirmPassword">Konfirmasi Password (harus sama)</label>
          <div class="input-wrapper">
            <i class="fas fa-shield-alt input-icon"></i>
            <input type="password" id="confirmPassword" placeholder="••••••••" required>
          </div>
        </div>

        <!-- Pilih Ekstrakurikuler -->
        <div class="input-group">
          <label for="ekstra">Pilih Ekstrakurikuler</label>
          <div class="input-wrapper">
            <i class="fas fa-users input-icon"></i>
            <select id="ekstra" required>
              <option value="" disabled selected>-- Pilih Ekstrakurikuler --</option>
              <option value="Jurnalistik">Jurnalistik</option>
              <option value="PMR">PMR (Palang Merah Remaja)</option>
              <option value="Paskibra">Paskibra</option>
              <option value="Pencak Silat">Pencak Silat</option>
              <option value="Nari">Nari (Seni Tari)</option>
              <option value="Bahasa Jepang">Bahasa Jepang</option>
              <option value="Bantara">Bantara (Pramuka)</option>
              <option value="Futsal">Futsal</option>
              <option value="Volly">Volly</option>
              <option value="Drumband">Drumband</option>
              <option value="MTQ">MTQ</option>
              <option value="Rohis">Rohis</option>
              <option value="Faster">Faster</option>
              <option value="Padus">Padus (Paduan Suara)</option>
            </select>
          </div>
        </div>

        <!-- Checkbox Syarat & Ketentuan -->
        <div class="checkbox-group">
          <label class="checkbox-container">
            <input type="checkbox" id="agreeTerms" required>
            <span class="checkmark"></span>
            <span class="checkbox-label">Saya menyetujui <a href="#" class="terms-link">syarat & ketentuan</a> pendaftaran</span>
          </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span>DAFTAR SEKARANG</span>
          <i class="fas fa-pen-nib btn-icon"></i>
        </button>
      </form>
    </div>

    <!-- KARAKTER BINTANG & PER (KANAN) -->
    <div class="character-section star-container">
      <div class="star-wrapper" id="starCharacter" title="Klik Saya untuk Melompat!">
        <div class="click-hint">Klik Saya!</div>
        <svg class="star-svg" viewBox="0 0 200 280">
          <defs>
            <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff7675" />
              <stop offset="50%" stop-color="#fdcb6e" />
              <stop offset="100%" stop-color="#00cec9" />
            </linearGradient>
          </defs>

          <!-- Karakter Bintang -->
          <g class="star-body">
            <polygon points="100,10 125,60 180,70 140,110 150,165 100,138 50,165 60,110 20,70 75,60" fill="url(#starGrad)" stroke="#fff" stroke-width="3"/>
            <circle cx="82" cy="80" r="8" fill="#2d3436"/>
            <circle cx="80" cy="78" r="3" fill="#fff"/>
            <circle cx="118" cy="80" r="8" fill="#2d3436"/>
            <circle cx="116" cy="78" r="3" fill="#fff"/>
            <circle cx="70" cy="95" r="7" fill="#ff7675" opacity="0.6"/>
            <circle cx="130" cy="95" r="7" fill="#ff7675" opacity="0.6"/>
            <path d="M 88 95 Q 100 112 112 95" fill="none" stroke="#2d3436" stroke-width="4" stroke-linecap="round"/>
          </g>

          <!-- Per / Spring (Bawah Bintang) -->
          <g class="spring-coils">
            <path d="M 70 160 C 130 160 130 180 70 180 C 130 180 130 200 70 200 C 130 200 130 220 70 220 C 130 220 130 240 70 240 C 130 240 130 255 100 255" 
                  fill="none" stroke="#485460" stroke-width="8" stroke-linecap="round" class="spring-path"/>
            <ellipse cx="100" cy="258" rx="35" ry="8" fill="#2d3436"/>
          </g>
        </svg>
      </div>
    </div>

  </div>

  <!-- POPUP NOTIFIKASI HIJAU -->
  <div class="notification-overlay" id="notifOverlay">
    <div class="notification-card">
      <div class="notif-icon-box">
        <i class="fas fa-check-circle"></i>
      </div>
      <h3>Pendaftaran Berhasil!</h3>
      <p id="notifMessage">Selamat, data pendaftaran Anda telah tercatat dalam sistem kami.</p>
      <button class="notif-btn" id="closeNotif">Tutup</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
